name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the host platform; Linux covers the signaling server.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
      # The browser client against the real host: shared files reach the browser's downloads.
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22
      - name: web client with the host
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        run: |
          cargo build -p ws-host
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          WS_HOST_BIN=../target/debug/ws-host npm run test:host
      - name: build release
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace --release
