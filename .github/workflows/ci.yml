name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the host platform; Linux covers the signaling server.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      # The synthetic capture source (test host's --synthetic) is behind a feature.
      - name: clippy (synthetic source)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p ws-capture -p ws-host --all-targets --features ws-capture/synthetic,ws-host/synthetic
      - name: test (synthetic source)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p ws-capture --features synthetic
      - name: test
        run: cargo test --workspace
      # The browser client against the real host: shared files reach the browser's downloads.
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22
      - name: web client with the host
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        run: |
          cargo build -p ws-host --example test-host
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          WS_HOST_BIN=../target/debug/examples/test-host npm run test:host
      - name: build release
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace --release
      # The installer friends download: built, installed silently, started,
      # uninstalled, and checked for leftovers.
      - name: installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./installer/fetch-redist.ps1
          ./installer/build.ps1 -Version 0.0.0-ci
          ./installer/test-install.ps1 -Setup target/installer/web-stream-setup-0.0.0-ci.exe

  # Headless Chromium against the transport's test pattern host: UDP, forced
  # ICE-TCP, and UDP firewalled so the browser has to fall back by itself.
  transport-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: cargo build -p ws-transport --example test_pattern
      - name: e2e
        run: node crates/transport/examples/e2e/run.mjs 18443
        env:
          TEST_BLOCK_UDP: '1'
          TEST_PATTERN_BIN: ${{ github.workspace }}/target/debug/examples/test_pattern
          PLAYWRIGHT_PATH: ${{ github.workspace }}/web/node_modules/playwright

  # The media path measured from Google Chrome: the test host streams fake displays (stamped
  # frames, software H.264) and a beep for game audio; the browser reads the stamps. Checks frame
  # rate, latency, lost frames, freezes, audio, mic and display switching, then the same on a bad
  # network (loss, a slow link, an outage) through a userspace proxy. Figures are in the job
  # summary and the media-report artifact.
  media-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y --no-install-recommends nasm
      - run: cargo build -p ws-host --example test-host --features synthetic
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: media tests
        working-directory: web
        run: npm run test:media
        env:
          WS_HOST_BIN: ${{ github.workspace }}/target/debug/examples/test-host
          MEDIA_REPORT: ${{ github.workspace }}/media-report/report.json
      - name: figures
        if: always()
        run: |
          mkdir -p media-report
          for f in media-report/*.json; do [ -f "$f" ] && { echo "### $f"; echo '```json'; cat "$f"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-report
          path: media-report
          if-no-files-found: ignore
