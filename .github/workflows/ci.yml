name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: Media Foundation
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $r = Install-WindowsFeature Server-Media-Foundation
          $r | Format-List | Out-String | Write-Host
          if ($r.Success -and "$($r.RestartNeeded)" -ne 'Yes') { "WS_REQUIRE_MF=1" >> $env:GITHUB_ENV }
          else { Write-Host "::warning::Media Foundation not available without a restart; its encoder test is skipped" }
      - name: test
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          node-version: 22
      - name: web client with the host
        if: matrix.os == 'ubuntu-24.04'
        working-directory: web
        run: |
          cargo build -p ws-host --example test-host
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          WS_HOST_BIN=../target/debug/examples/test-host npm run test:host
      - name: build release
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace --release
      - name: network host sandbox
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./installer/test-network-sandbox.ps1 -Exe target/release/ws-host-gui.exe
      - name: installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./installer/fetch-redist.ps1
          ./installer/build.ps1 -Version 0.0.0-ci
          ./installer/test-install.ps1 -Setup target/installer/web-stream-setup-0.0.0-ci.exe
      - name: one-line installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./installer/test-web-install.ps1 -Setup target/installer/web-stream-setup-0.0.0-ci.exe
      - name: keep the installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: web-stream-setup-ci
          path: target/installer/web-stream-setup-0.0.0-ci.exe
          if-no-files-found: error
          retention-days: 14

  transport-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: build the test pattern host (release, so its software AV1 encoder keeps up on a shared runner)
        run: cargo build --release -p ws-transport --example test_pattern
      - name: e2e
        run: node crates/transport/examples/e2e/run.mjs 18443
        env:
          TEST_BLOCK_UDP: '1'
          TEST_PATTERN_BIN: ${{ github.workspace }}/target/release/examples/test_pattern
          PLAYWRIGHT_PATH: ${{ github.workspace }}/web/node_modules/playwright
