name: Linux input, audio, clipboard and display modes

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - crates/input/**
      - crates/audio/**
      - crates/host/src/platform.rs
      - crates/host/src/clipboard*/**
      - crates/host/src/clipboard.rs
      - crates/host/src/display_mode/**
      - crates/host/src/session_helper.rs
      - crates/capture/src/modes.rs
      - crates/host/src/uploads.rs
      - crates/host/src/files.rs
      - .github/workflows/linux-io.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux-io:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pipewire pipewire-pulse wireplumber pulseaudio-utils dbus \
            xvfb xclip sway wl-clipboard \
            xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils

      - name: virtual devices through uinput and evdev
        run: |
          # The runner sits at a text console, where Ctrl+Alt+Del would restart it.
          sudo systemctl mask ctrl-alt-del.target
          sudo modprobe uinput
          test -c /dev/uinput
          # The test creates devices and reads /dev/input/event*, so it runs as root.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="sudo -E" \
            cargo test -p ws-input --test linux_uinput -- --nocapture

      - name: loopback capture and virtual microphone on PipeWire
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          cargo test -p ws-audio --test linux_pulse --no-run
          dbus-run-session -- sh -ec '
            pipewire & sleep 1
            wireplumber & pipewire-pulse &
            for i in $(seq 50); do pactl info >/dev/null 2>&1 && break; sleep 0.2; done
            pactl info
            cargo test -p ws-audio --test linux_pulse -- --nocapture
          '

      - name: clipboard helper on X11 and Wayland
        run: |
          cargo build -p ws-host --example test-host
          cat > "$RUNNER_TEMP/clip.py" <<'EOF'
          import os, select, struct, subprocess, sys, time
          helper, mode = sys.argv[1], sys.argv[2]
          def frame(kind, payload):
              return kind + struct.pack('<I', len(payload)) + payload
          def read_frame(f):
              if not select.select([f], [], [], 5)[0]:
                  return None
              head = f.read(5)
              return head[:1], f.read(struct.unpack('<I', head[1:])[0])
          def paste():
              cmd = ['xclip', '-o', '-selection', 'clipboard'] if mode == 'x11' else ['wl-paste', '-n']
              return subprocess.run(cmd, capture_output=True, timeout=5).stdout
          def copy(data):
              cmd = ['xclip', '-i', '-selection', 'clipboard'] if mode == 'x11' else ['wl-copy']
              subprocess.run(cmd, input=data, timeout=5, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          p = subprocess.Popen([helper, 'clipboard-helper'], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          time.sleep(0.5)
          text = 'from browser é'.encode()
          p.stdin.write(frame(b'S', text)); p.stdin.flush()
          assert read_frame(p.stdout) == (b'W', b'\x01')
          time.sleep(0.3)
          assert paste() == text, paste()
          copy(b'copied on host')
          got = read_frame(p.stdout)
          while got and got[1] == text:
              got = read_frame(p.stdout)
          assert got == (b'C', b'copied on host'), got
          copy(b'x' * (256 * 1024 + 5))
          assert read_frame(p.stdout) == (b'L', b''), 'size cap'
          p.stdin.close()
          assert p.wait(timeout=5) == 0
          print(mode, 'ok')
          EOF
          Xvfb :99 -nolisten tcp & sleep 1
          DISPLAY=:99 timeout 60 python3 "$RUNNER_TEMP/clip.py" target/debug/examples/test-host x11
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdgw"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo 'xwayland disable' > "$RUNNER_TEMP/sway.conf"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman \
            sway -c "$RUNNER_TEMP/sway.conf" & sleep 2
          WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-* | grep -v lock | head -1)") \
            timeout 60 python3 "$RUNNER_TEMP/clip.py" target/debug/examples/test-host wayland

      - name: display mode helper on X11 and Wayland
        run: |
          cargo build -p ws-host --example test-host
          cat > "$RUNNER_TEMP/mode.py" <<'EOF'
          import json, os, select, signal, struct, subprocess, sys, time
          helper, kind, first, second = sys.argv[1:5]
          def frame(payload):
              body = json.dumps(payload).encode()
              return b'Q' + struct.pack('<I', len(body)) + body
          def reply(p):
              assert select.select([p.stdout], [], [], 20)[0], 'no reply'
              head = p.stdout.read(5)
              assert head[:1] == b'A', head
              return json.loads(p.stdout.read(struct.unpack('<I', head[1:])[0]))
          def outputs():
              if kind == 'x11':
                  out = {}
                  for line in subprocess.run(['xrandr'], capture_output=True, text=True, check=True).stdout.splitlines():
                      parts = line.split()
                      if len(parts) > 2 and parts[1] == 'connected':
                          geo = next((p for p in parts[2:] if '+' in p and 'x' in p), None)
                          if geo:
                              size, x, y = geo.split('+')
                              w, h = size.split('x')
                              out[parts[0]] = (int(w), int(h), int(x), int(y))
                  return out
              out = {}
              for o in json.loads(subprocess.run(['swaymsg', '-t', 'get_outputs', '-r'], capture_output=True, text=True, check=True).stdout):
                  if o.get('active'):
                      m = o['current_mode']
                      out[o['name']] = (m['width'], m['height'], o['rect']['x'], o['rect']['y'])
              return out
          def start():
              return subprocess.Popen([helper, 'display-helper'], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          def send(p, payload):
              p.stdin.write(frame(payload)); p.stdin.flush()
              return reply(p)
          def change(p, w, h):
              r = send(p, {'set': {'connector': first, 'edid': None, 'width': w, 'height': h}})
              assert 'set' in r, r
              return r['set']

          before = outputs()
          print(kind, 'before', before)
          assert first in before and second in before, before
          fw, fh, fx, fy = before[first]
          sw, sh, sx, sy = before[second]
          assert sx == fx + fw, 'second output right of the first'

          # Set, then restore on request.
          p = start()
          got = change(p, 1024, 768)
          assert got == {'width': 1024, 'height': 768, 'changed': True, 'remaining': 1}, got
          time.sleep(0.5)
          now = outputs()
          print(kind, 'changed', now)
          assert now[first][:2] == (1024, 768), now
          assert now[second][2] == fx + 1024, 'neighbour moved with the edge'
          again = change(p, 1024, 768)
          assert again['changed'] is False and again['remaining'] == 1, again
          r = send(p, {'restore': {'connector': first}})
          assert r == {'restored': {'remaining': 0}}, r
          time.sleep(0.5)
          assert outputs() == before, outputs()

          # Restored when stdin closes.
          change(p, 800, 600)
          time.sleep(0.5)
          assert outputs()[first][:2] == (800, 600), outputs()
          p.stdin.close()
          assert p.wait(timeout=20) == 0
          time.sleep(0.5)
          assert outputs() == before, outputs()

          # Restored on SIGTERM.
          p = start()
          change(p, 1024, 768)
          time.sleep(0.5)
          assert outputs()[first][:2] == (1024, 768)
          p.send_signal(signal.SIGTERM)
          assert p.wait(timeout=20) == 0
          time.sleep(0.5)
          assert outputs() == before, outputs()

          # A size nothing fits is refused and changes nothing.
          p = start()
          r = send(p, {'set': {'connector': first, 'edid': None, 'width': 16, 'height': 16}})
          assert 'failed' in r, r
          p.stdin.close()
          assert p.wait(timeout=20) == 0
          assert outputs() == before
          print(kind, 'ok')
          EOF
          # Xorg's dummy driver has real RandR outputs and modes; it runs as root, the helper as
          # this (unprivileged) user, as in a signed-in session.
          cat > "$RUNNER_TEMP/dummy.conf" <<'EOF'
          Section "Device"
            Identifier "dummy"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Monitor"
            Identifier "monitor"
            HorizSync 5.0-1000.0
            VertRefresh 5.0-200.0
          EndSection
          Section "Screen"
            Identifier "screen"
            Device "dummy"
            Monitor "monitor"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1920x1080"
              Virtual 3840 2160
            EndSubSection
          EndSection
          EOF
          sudo Xorg :98 -noreset -nolisten tcp -config "$RUNNER_TEMP/dummy.conf" \
            -logfile "$RUNNER_TEMP/xorg.log" & sleep 3
          export DISPLAY=:98
          xrandr --newmode 1280x1024_60 108.00 1280 1328 1440 1688 1024 1025 1028 1066 +hsync +vsync
          xrandr --addmode DUMMY1 1280x1024_60
          xrandr --output DUMMY0 --mode 1920x1080 --output DUMMY1 --mode 1280x1024_60 --right-of DUMMY0
          XDG_SESSION_TYPE=x11 timeout 120 python3 "$RUNNER_TEMP/mode.py" \
            target/debug/examples/test-host x11 DUMMY0 DUMMY1
          sudo pkill -f 'Xorg :98' || true
          unset DISPLAY
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdgm"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo 'xwayland disable' > "$RUNNER_TEMP/sway.conf"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman \
            sway -c "$RUNNER_TEMP/sway.conf" & sleep 2
          export SWAYSOCK=$(ls "$XDG_RUNTIME_DIR"/sway-ipc.* | head -1)
          swaymsg create_output
          WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-* | grep -v lock | head -1)") \
            timeout 120 python3 "$RUNNER_TEMP/mode.py" target/debug/examples/test-host wayland HEADLESS-1 HEADLESS-2
