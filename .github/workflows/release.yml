name: release

# Push a tag vX.Y.Z (or vX.Y.Z-rc.1 for a pre-release) on a commit on main,
# or run it from the Actions tab on main with the version and notes; then the
# tag is made only once the build has passed. The build runs on its own; publishing waits for approval in the `release`
# environment if it has a required reviewer. See docs/dev/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 or 0.1.0-rc.1 (must match Cargo.toml)
        required: true
        type: string
      notes:
        description: Release notes, shown in the tray before updating
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: tag matches Cargo.toml, commit is on main
        env:
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="v${INPUT_VERSION#v}"
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::run the release from main, not $GITHUB_REF"; exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
              echo "::error::$TAG already exists: pick a new version"; exit 1
            fi
          else
            TAG="$PUSHED_TAG"
          fi
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-pre"; exit 1
          fi
          base="${BASH_REMATCH[1]}"
          pre="${BASH_REMATCH[2]}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$cargo_version" != "$base" ]; then
            echo "::error::tag $TAG doesn't match workspace version $cargo_version in Cargo.toml"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main: only main is released"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "$pre" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      RUST_VERSION: 1.97.0
    steps:
      - uses: actions/checkout@v4
      # No build cache and no third-party action: a release is built from
      # scratch from Cargo.lock, with a pinned compiler (rustup comes with
      # the runner). Move RUST_VERSION forward deliberately.
      - name: toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component rustfmt,clippy
          rustup override set $env:RUST_VERSION
          rustc --version
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked
      - name: build
        run: cargo build --release --locked -p ws-host-gui
      - name: zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # cloudflared goes next to the exe, where the host looks for it
          # when a Cloudflare Tunnel is on.
          ./installer/fetch-redist.ps1
          $stage = 'target/zip'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/ws-host-gui.exe $stage
          Copy-Item installer/redist/cloudflared-windows-amd64.exe "$stage/cloudflared.exe"
          Copy-Item -Recurse installer/third-party $stage
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "dist/web-stream-host-$env:VERSION-windows-x64.zip"
      - name: installer
        shell: pwsh
        run: |
          ./installer/fetch-redist.ps1
          ./installer/build.ps1 -Version $env:VERSION
          Copy-Item "target/installer/web-stream-setup-$env:VERSION.exe" dist/
      - name: installer works
        shell: pwsh
        run: ./installer/test-install.ps1 -Setup "dist/web-stream-setup-$env:VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  # Publishes. Pauses until Logan approves the run when the `release`
  # environment has a required reviewer; it needs no secrets.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      # Run from the Actions tab: the tag is made here, after the build has
      # passed, at the commit that was built. (A tag pushed with the job's
      # token doesn't start this workflow again.)
      - name: tag
        if: github.event_name == 'workflow_dispatch'
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          git tag -a "$TAG" "$GITHUB_SHA" -F "$RUNNER_TEMP/notes.txt"
          git push origin "refs/tags/$TAG"
      - name: manifest
        run: |
          set -euo pipefail
          cd dist
          # The tag's message is the release notes the host shows. An
          # annotated tag only, and without its own signature block, if it
          # has one.
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag: tag with git tag -a and the release notes as its message"; exit 1
          fi
          notes=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG")
          files=$(for f in *.zip *.exe; do
            jq -n --arg name "$f" --argjson size "$(stat -c %s "$f")" \
              --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" '{name: $name, size: $size, sha256: $sha256}'
          done | jq -s .)
          jq -n --arg version "$VERSION" --arg released "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$notes" --argjson files "$files" \
            '{product: "web-stream-host", version: $version, released: $released, files: $files, notes: $notes}' \
            > manifest.json
          sha256sum *.zip *.exe manifest.json > SHA256SUMS.txt
          cat manifest.json
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --title "web-stream host $VERSION" "${flags[@]}"
