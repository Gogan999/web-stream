name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 or 0.1.0-rc.1 (must match Cargo.toml)
        required: true
        type: string
      notes:
        description: Release notes, shown in the tray before updating
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: tag matches Cargo.toml, commit is on main
        env:
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="v${INPUT_VERSION#v}"
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::run the release from main, not $GITHUB_REF"; exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
              echo "::error::$TAG already exists: pick a new version"; exit 1
            fi
          else
            TAG="$PUSHED_TAG"
          fi
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-pre"; exit 1
          fi
          base="${BASH_REMATCH[1]}"
          pre="${BASH_REMATCH[2]}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$cargo_version" != "${base}${pre}" ]; then
            echo "::error::tag $TAG doesn't match workspace version $cargo_version in Cargo.toml"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main: only main is released"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "$pre" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      RUST_VERSION: 1.97.0
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component rustfmt,clippy
          rustup override set $env:RUST_VERSION
          rustc --version
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked
      - name: build
        run: cargo build --release --locked -p ws-host-gui
      - name: zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          ./installer/fetch-redist.ps1
          $stage = 'target/zip'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/ws-host-gui.exe $stage
          Copy-Item installer/redist/cloudflared-windows-amd64.exe "$stage/cloudflared.exe"
          Copy-Item -Recurse installer/third-party $stage
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "dist/web-stream-host-$env:VERSION-windows-x64.zip"
      - name: installer
        shell: pwsh
        run: |
          ./installer/fetch-redist.ps1
          ./installer/build.ps1 -Version $env:VERSION
          Copy-Item "target/installer/web-stream-setup-$env:VERSION.exe" dist/
          Copy-Item installer/web-stream-install.ps1 dist/
      - name: installer works
        shell: pwsh
        run: ./installer/test-install.ps1 -Setup "dist/web-stream-setup-$env:VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  linux:
    needs: check
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            cloudflared: amd64
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            cloudflared: arm64
    env:
      VERSION: ${{ needs.check.outputs.version }}
      RUST_VERSION: 1.97.0
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup override set "$RUST_VERSION"
      - name: cross compiler
        if: matrix.arch == 'aarch64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: build
        run: cargo build --release --locked -p ws-host --bin web-stream --target ${{ matrix.target }}
      - name: no GPU libraries linked
        run: |
          set -euo pipefail
          needed=$(readelf -d target/${{ matrix.target }}/release/web-stream | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          echo "$needed"
          if echo "$needed" | grep -Ev '^(libc|libm|libgcc_s|libpthread|libdl|librt|ld-linux[-a-z0-9_]*)\.so'; then
            echo "::error::the host links a library beyond glibc; GPU libraries are loaded at run time"; exit 1
          fi
      - name: tarball
        run: |
          ./installer/fetch-redist.sh
          ./installer/linux-tarball.sh "$VERSION" ${{ matrix.arch }} \
            target/${{ matrix.target }}/release/web-stream \
            installer/redist/cloudflared-linux-${{ matrix.cloudflared }} dist
      - name: installer works
        if: matrix.arch == 'x86_64'
        run: ./installer/test-linux-install.sh "dist/web-stream-host-$VERSION-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [check, build, linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: tag
        if: github.event_name == 'workflow_dispatch'
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          git tag -a "$TAG" "$GITHUB_SHA" -F "$RUNNER_TEMP/notes.txt"
          git push origin "refs/tags/$TAG"
      - name: manifest
        run: |
          set -euo pipefail
          cp installer/web-stream-install.sh dist/
          cd dist
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag: tag with git tag -a and the release notes as its message"; exit 1
          fi
          notes=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG")
          files=$(for f in *.zip *.exe *.tar.gz; do
            jq -n --arg name "$f" --argjson size "$(stat -c %s "$f")" \
              --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" '{name: $name, size: $size, sha256: $sha256}'
          done | jq -s .)
          jq -n --arg version "$VERSION" --arg released "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$notes" --argjson files "$files" \
            '{product: "web-stream-host", version: $version, released: $released, files: $files, notes: $notes}' \
            > manifest.json
          sha256sum *.zip *.exe *.tar.gz *.ps1 *.sh manifest.json > SHA256SUMS.txt
          cat manifest.json
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --title "web-stream host $VERSION" "${flags[@]}"
