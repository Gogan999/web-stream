name: web client

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-client.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-client.yml']

permissions:
  contents: read

concurrency:
  group: web-client-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Same self-hosted Windows runner as CI (docs/self-hosted-runner.md).
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: powershell
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Browsers land in %LOCALAPPDATA%\ms-playwright and are reused.
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:e2e
