[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/nvenc-sys",
    "crates/capture",
    "crates/transport",
    "crates/input",
    "crates/audio",
    "crates/signaling",
    "crates/host",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gogan999/web-stream"

[workspace.dependencies]
ws-proto = { path = "crates/proto" }
ws-capture = { path = "crates/capture" }
ws-transport = { path = "crates/transport" }
ws-input = { path = "crates/input" }
ws-audio = { path = "crates/audio" }
ws-nvenc-sys = { path = "crates/nvenc-sys" }

anyhow = "1"
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
windows = "0.62"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
