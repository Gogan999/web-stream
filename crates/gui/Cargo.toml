[package]
name = "ws-host-gui"
description = "Tray app and settings window for the host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ws-host = { path = "../host" }
ws-capture.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[dev-dependencies]
ws-input.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
rfd = { version = "0.15", default-features = false }
raw-window-handle = "0.6"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
