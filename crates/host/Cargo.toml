[package]
name = "ws-host"
description = "Host agent: wires capture, audio, input and transport together"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ws-proto.workspace = true
ws-diag.workspace = true
ws-capture.workspace = true
ws-transport.workspace = true
ws-input.workspace = true
ws-audio.workspace = true
ws-signaling = { path = "../signaling" }
anyhow.workspace = true
getrandom = "0.3"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ws-desktop.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
