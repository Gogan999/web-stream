[package]
name = "ws-host"
description = "Host agent: wires capture, audio, input and transport together"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ws-proto.workspace = true
ws-diag.workspace = true
ws-capture.workspace = true
ws-transport.workspace = true
ws-input.workspace = true
ws-audio.workspace = true
ws-signaling = { path = "../signaling" }
anyhow.workspace = true
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "net", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ws-desktop.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
base64.workspace = true
hmac = "0.12"
igd-next = "0.16"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
subtle = "2.6"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["xfixes"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "web-stream"
path = "src/bin/web-stream.rs"

[lints]
workspace = true
