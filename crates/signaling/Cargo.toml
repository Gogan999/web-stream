[package]
name = "ws-signaling"
description = "HTTPS server embedded in the host: web client, device pairing and WebRTC signaling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ws-proto.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "timeout"] }
tracing.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
tokio-rustls = { version = "0.26", default-features = false }
time = "0.3"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.30"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
