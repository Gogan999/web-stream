[package]
name = "ws-transport"
description = "WebRTC transport: media tracks and data channels to the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ws-proto.workspace = true
ws-diag.workspace = true
bytes.workspace = true
local-ip-address = "0.6"
socket2 = "0.6"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
rav1e = { version = "0.8.1", default-features = false }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ws-signaling = { path = "../signaling" }
